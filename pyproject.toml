[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basal-station"
version = "0.1.0"
description = "Local control plane for basal typed-decision models — multi-backend (MLX / GGUF-CUDA / Metal / eager / vLLM), grounded in your knowledge-palace MCP knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Edwin Barczynski" }]
keywords = ["basal", "typed-decisions", "llama.cpp", "mlx", "rag", "mcp"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "mcp>=2.0",
    "huggingface-hub>=0.30",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
basal-station = "basal_station.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/basal_station"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Hardware probing and service boundaries deliberately catch broad exceptions
# and tolerate subprocess failures; keep those patterns quiet.
ignore = ["BLE001", "S110", "PLW1510", "SIM117", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
